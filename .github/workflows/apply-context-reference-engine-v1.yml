name: Apply Context Reference Engine v1

on:
  push:
    branches: [feature/context-reference-engine-v1]
    paths:
      - tools/apply_context_reference_engine_v1.py
      - .github/workflows/apply-context-reference-engine-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_context_reference_engine_v1.py
      - name: Compile
        run: python -m compileall -q .
      - name: Run regression suite
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee CONTEXT_REFERENCE_TEST_FAILURE.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve failure evidence
        if: steps.tests.outputs.status != '0'
        run: |
          git config user.name "HumanOS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CONTEXT_REFERENCE_TEST_FAILURE.log
          git commit -m "Record Context Reference Engine test failure"
          git push
          exit 1
      - name: Commit verified implementation
        if: steps.tests.outputs.status == '0'
        run: |
          git config user.name "HumanOS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add references.py runtime_info.py permissions.py server.py tests/test_references.py
          git diff --cached --quiet && exit 0
          git commit -m "Add Context Reference Engine v1"
          git push
