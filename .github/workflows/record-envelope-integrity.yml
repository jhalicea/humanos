name: HumanOS record envelope integrity gate

on:
  push:
    branches: [feature/record-envelope-integrity]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/record-envelope-integrity
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply guarded implementation
        run: |
          python3 tools/apply_record_envelope_integrity.py
          python3 tools/adjust_integrity_key_migration_test.py
      - name: Compile changed Python
        run: python3 -m py_compile notebook.py tests/test_content_digest_privacy.py tests/test_integrity_key_portability.py tests/test_record_envelope_integrity.py
      - name: Run full regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Commit only after all tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebook.py tests/test_content_digest_privacy.py tests/test_integrity_key_portability.py tests/test_record_envelope_integrity.py
          if ! git diff --cached --quiet; then
            git commit -m "Add record envelope integrity and transactional sequence counter"
            git push origin HEAD:feature/record-envelope-integrity
          fi
