name: HumanOS LN-0 Python SQLCipher diagnostic

on:
  workflow_dispatch:
  push:
    branches: [life-notebook-ln0]
    paths:
      - '.github/workflows/ln0-sqlcipher-python-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install rejected candidate for diagnosis only
        run: python -m pip install --disable-pip-version-check 'sqlcipher3==0.6.2'
      - name: Record bundled SQLCipher version
        id: cipher
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import sqlcipher3
          c = sqlcipher3.connect(':memory:')
          c.execute("PRAGMA key = \"x'000102030405060708090A0B0C0D0E0F101112131415161718191A1B1C1D1E1F'\"")
          print(c.execute('PRAGMA cipher_version').fetchone()[0])
          c.close()
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > sqlcipher-version.txt
      - name: Upload version as evidence metadata
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-${{ steps.cipher.outputs.version }}-${{ matrix.os }}-py${{ matrix.python }}
          path: sqlcipher-version.txt
          retention-days: 7
      - name: Functional DB-API smoke check without freshness policy
        run: |
          python - <<'PY'
          import pathlib, secrets, sqlite3 as stdlib, tempfile
          import sqlcipher3
          with tempfile.TemporaryDirectory() as tmp:
              p = pathlib.Path(tmp) / 'x.db'
              key = secrets.token_bytes(32)
              key_sql = f'PRAGMA key = "x\'{key.hex().upper()}\'"'
              db = sqlcipher3.connect(str(p))
              db.execute(key_sql)
              assert db.execute('PRAGMA journal_mode=WAL').fetchone()[0].lower() == 'wal'
              db.execute('CREATE TABLE t(v TEXT NOT NULL)')
              db.execute('INSERT INTO t VALUES(?)', ('exact-marker',))
              db.commit(); db.close()
              db = sqlcipher3.connect(str(p)); db.execute(key_sql)
              assert db.execute('SELECT v FROM t').fetchone()[0] == 'exact-marker'
              db.close()
              plain = stdlib.connect(str(p))
              try:
                  try: plain.execute('SELECT * FROM t').fetchall()
                  except stdlib.DatabaseError: pass
                  else: raise AssertionError('stdlib SQLite read encrypted DB')
              finally: plain.close()
          PY
      - name: Security freshness gate (expected to reject stale core if below 4.14)
        continue-on-error: true
        run: |
          python - <<'PY'
          import sqlcipher3
          db = sqlcipher3.connect(':memory:')
          db.execute("PRAGMA key = \"x'000102030405060708090A0B0C0D0E0F101112131415161718191A1B1C1D1E1F'\"")
          v = tuple(int(x) for x in db.execute('PRAGMA cipher_version').fetchone()[0].split('.')[:3])
          db.close()
          assert (4,14,0) <= v < (5,0,0), v
          PY
