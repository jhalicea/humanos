name: HumanOS encrypted backup tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: encrypted-backup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  encrypted-backup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install encrypted-backup dependency
        run: python -m pip install --disable-pip-version-check -r requirements-encrypted-backup.txt
      - name: Run full suite with encrypted-backup coverage
        run: python -m unittest discover -s tests -v
