name: Work Executor v3 integration
on:
  push:
    paths:
      - tools/apply_work_executor_v3_blocked_state.py
      - .github/workflows/work-executor-v3-patch.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/work-executor-v3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply final state patch
        run: |
          sed -i "/if text.count(old) != 1:/,+1d" tools/apply_work_executor_v3_blocked_state.py
          sed -i "s/text.replace(old, new, 1)/text.replace(old, new)/" tools/apply_work_executor_v3_blocked_state.py
          python tools/apply_work_executor_v3_blocked_state.py
      - name: Compile changed runtime
        run: python -m py_compile work_executor.py work_mode.py permissions.py engine.py server.py
      - name: Run focused Work Executor tests
        run: python -m unittest tests.test_work_executor tests.test_work_mode -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified runtime
        run: |
          git config user.name 'HumanOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add work_executor.py work_mode.py server.py tests/test_work_executor.py
          git diff --cached --quiet && exit 0
          git commit -m 'Persist blocked work and verified deliverables'
          git push origin HEAD:feature/work-executor-v3
