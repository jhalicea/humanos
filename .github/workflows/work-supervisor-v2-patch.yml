name: Work Supervisor v2 patch

on:
  push:
    branches: [feature/work-supervisor-v2]
    paths:
      - tools/_apply_work_supervisor_v2.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/work-supervisor-v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply narrow source patch
        run: python tools/_apply_work_supervisor_v2.py
      - name: Compile
        run: python -m py_compile engine.py server.py permissions.py work_mode.py
      - name: Run focused tests
        run: python -m unittest tests.test_work_mode tests.test_runtime_info tests.test_file_intelligence
      - name: Commit patched runtime
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HumanOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add engine.py server.py permissions.py work_mode.py
          git commit -m "Bind delegated work scope to verified jobs"
          git push origin HEAD:feature/work-supervisor-v2
