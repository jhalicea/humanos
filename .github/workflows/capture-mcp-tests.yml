name: HumanOS capture MCP

on:
  push:
    branches:
      - feature/capture-fabric-bakeoff
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install capture dependencies
        run: python -m pip install -r requirements-capture.txt
      - name: Import MCP server and verify authority surface
        run: |
          python - <<'PY'
          import capture_mcp_server
          from capture_mcp_gateway import HumanOSCaptureMCP
          from capture_fabric import CaptureGateway, SQLiteRelay
          import tempfile
          from pathlib import Path

          assert capture_mcp_server.mcp is not None
          with tempfile.TemporaryDirectory() as tmp:
              relay = SQLiteRelay(Path(tmp) / 'relay.sqlite3')
              try:
                  app = HumanOSCaptureMCP(CaptureGateway(relay.append))
                  assert [tool['name'] for tool in app.list_tools()] == [
                      'humanos_append_capture_event'
                  ]
              finally:
                  relay.close()
          PY
