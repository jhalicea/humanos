name: HumanOS LN-0 SQLCipher spike

on:
  workflow_dispatch:
  push:
    branches: [life-notebook-ln0]
    paths:
      - 'experiments/ln0_sqlcipher_spike.py'
      - 'tests/test_ln0_sqlcipher_spike.py'
      - 'requirements-encrypted-backup.txt'
      - '.github/workflows/ln0-sqlcipher-spike.yml'

permissions:
  contents: read

concurrency:
  group: ln0-sqlcipher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlcipher-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install stable SQLCipher
        run: brew install sqlcipher
      - name: Install existing HumanOS recovery-wrapper dependency
        run: python -m pip install --disable-pip-version-check -r requirements-encrypted-backup.txt
      - name: Record SQLCipher package/version without key material
        run: |
          which sqlcipher
          sqlcipher -version
          brew info sqlcipher | head -20
      - name: Run V-02 encrypted storage verification
        env:
          HUMANOS_LN0_SQLCIPHER_SPIKE: '1'
        run: python -m unittest tests.test_ln0_sqlcipher_spike -v
