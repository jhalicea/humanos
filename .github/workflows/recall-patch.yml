name: HumanOS recall patch gate

on:
  push:
    branches: [feature/local-notebook-recall]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/local-notebook-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded recall integration patch
        run: python3 tools/apply_recall_patch.py
      - name: Run full regression suite before commit
        run: python3 -m unittest discover -s tests -v
      - name: Commit only after full suite passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capabilities.py permissions.py runtime_info.py
          if ! git diff --cached --quiet; then
            git commit -m "Add owner-directed Life Notebook recall across sessions"
            git push origin HEAD:feature/local-notebook-recall
          fi
