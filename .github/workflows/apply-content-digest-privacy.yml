name: Apply content digest privacy patch
on:
  push:
    branches: [feature/content-digest-privacy]
    paths: [.github/workflows/apply-content-digest-privacy.yml]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Correct bootstrap guard
        run: python tools/fix_content_digest_guard.py
      - name: Apply fail-closed source migration
        run: python tools/apply_content_digest_privacy.py
      - name: Run full regression suite before commit
        run: python -m unittest discover -s tests -v
      - name: Commit tested patch to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebook.py tests/test_content_digest_privacy.py
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "Protect Notebook content digests with vault HMAC"
          git push origin HEAD:feature/content-digest-privacy
# retry after bootstrap guard correction
