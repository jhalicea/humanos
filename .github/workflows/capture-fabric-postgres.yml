name: HumanOS capture fabric Postgres

on:
  push:
    branches:
      - feature/capture-fabric-bakeoff
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-relay:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: humanos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d humanos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: humanos_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply capture relay schema
        run: psql -v ON_ERROR_STOP=1 -f sql/capture_fabric_postgres.sql
      - name: Verify append-only relay behavior
        run: psql -v ON_ERROR_STOP=1 -f tests/capture_fabric_postgres.sql
