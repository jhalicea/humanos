name: Apply integrity key lifecycle patch
on:
  push:
    branches: [feature/integrity-key-portable-backup]
    paths: [.github/workflows/apply-integrity-key-lifecycle.yml]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Apply fail-closed Notebook lifecycle patch
        run: python tools/apply_integrity_key_lifecycle.py
      - name: Run full regression suite before commit
        run: python -m unittest discover -s tests -v
      - name: Commit exact tested Notebook integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebook.py
          git diff --cached --quiet && { echo "No Notebook patch produced"; exit 1; }
          git commit -m "Bind integrity key before Notebook recovery"
          git push origin HEAD:feature/integrity-key-portable-backup
# retry after WAL-sidecar tamper test fix
