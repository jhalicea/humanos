name: HumanOS record envelope patch gate

on:
  push:
    branches: [feature/record-envelope-integrity]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/record-envelope-integrity
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Apply guarded record envelope v2 patch
        run: python3 tools/apply_record_envelope_patch_v2.py
      - name: Run full regression suite before commit
        run: python3 -m unittest discover -s tests -v
      - name: Commit only after full suite passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebook.py tests/test_record_envelope_integrity.py
          if ! git diff --cached --quiet; then
            git commit -m "Add transcript record envelope integrity with downgrade protection"
            git push origin HEAD:feature/record-envelope-integrity
          fi
