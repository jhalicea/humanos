name: HumanOS LN-0 Python SQLCipher driver

on:
  workflow_dispatch:
  push:
    branches: [life-notebook-ln0]
    paths:
      - 'experiments/ln0_sqlcipher_python_driver.py'
      - 'tests/test_ln0_sqlcipher_python_driver.py'
      - '.github/workflows/ln0-sqlcipher-python-driver.yml'

permissions:
  contents: read

concurrency:
  group: ln0-sqlcipher-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-driver:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned candidate SQLCipher DB-API wheel
        run: python -m pip install --disable-pip-version-check 'sqlcipher3==0.6.2'
      - name: Run candidate-driver qualification
        env:
          HUMANOS_LN0_SQLCIPHER_PYTHON: '1'
        run: python -m unittest tests.test_ln0_sqlcipher_python_driver -v
