name: One-shot Academy registry reconciliation

on:
  push:
    branches:
      - promotion/academy-v0.1

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'jhalicea/humanos' && github.ref == 'refs/heads/promotion/academy-v0.1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: promotion/academy-v0.1
          persist-credentials: true

      - name: Reconcile Academy lineage in public context registry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('config/context_registry.public.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          workstreams = data['workstreams']
          by_id = {item['workstream_id']: item for item in workstreams}

          legacy = by_id['HOS-LEARN-001']
          legacy['status'] = 'SUPERSEDED'
          legacy['resume_point'] = (
              'Historical Academy branch preserved for provenance. It is superseded by '
              'HOS-LEARN-002, promoted through PR #118.'
          )
          legacy['next_action'] = (
              'Do not resume this historical branch directly; extend the promoted HOS-LEARN-002 lineage.'
          )

          mastery = by_id['HOS-MASTERY-001']
          mastery['status'] = 'PROMOTED'
          mastery['last_verified_commit'] = 'be0ce155c40cdfe33ace858f55df7ca3d2efa0d5'
          mastery['resume_point'] = (
              'Adaptive Mastery Engine v1 was promoted through PR #58 at merge commit '
              'be0ce155c40cdfe33ace858f55df7ca3d2efa0d5 and is now a dependency of HOS-LEARN-002.'
          )
          mastery['next_action'] = (
              'Preserved as the mastery substrate; extend through HOS-LEARN-002 or a new bounded mastery workstream.'
          )

          academy = {
              'workstream_id': 'HOS-LEARN-002',
              'workspace_id': 'WS-HUMANOS',
              'title': 'Adaptive Academy Kernel & Runtime Vertical Slice',
              'project': 'Learning and Mastery',
              'repository': 'jhalicea/humanos',
              'branch': 'feature/academy-kernel-runtime-v1',
              'work_order': 'docs/work-orders/HOS-LEARN-002.md',
              'status': 'PROMOTED',
              'confidentiality': 'INTERNAL',
              'topics': [
                  'learning', 'academy', 'course', 'mastery', 'skills', 'curriculum',
                  'grading', 'teaching protocol', 'certifications', 'job packs', 'learner state'
              ],
              'components': [
                  'learning/academy_models.py',
                  'learning/academy_loader.py',
                  'learning/academy_store.py',
                  'learning/teaching_protocol.py',
                  'learning/academy_cli.py',
                  'learning/protocols/humanos-teaching-v1.json',
                  'schemas/academy-package-v1.schema.json',
                  'docs/academy',
                  'tests/test_academy_kernel.py',
                  'tests/test_academy_store.py',
                  'tests/test_academy_cli.py',
                  'config/context_registry.public.json'
              ],
              'relations': [
                  {'relation': 'EXTENDS', 'target_workstream_id': 'HOS-MASTERY-001'},
                  {'relation': 'SUPERSEDES', 'target_workstream_id': 'HOS-LEARN-001'}
              ],
              'last_verified_commit': '5e535a2de48b984a90f7ed5ba5d26864cd4fab86',
              'resume_point': (
                  'Promoted through PR #118 at merge commit '
                  '5e535a2de48b984a90f7ed5ba5d26864cd4fab86 after green macOS/Ubuntu '
                  'Python 3.11/3.13 regression and encrypted-backup matrices. The reusable Academy '
                  'kernel is canonical; real curriculum and learner state remain private.'
              ),
              'next_action': (
                  'Use the promoted Academy kernel with the private curriculum package. The next bounded '
                  'Academy increment should build the Mission Board / first real session flow without '
                  'auto-resuming historical unfinished work.'
              )
          }

          if 'HOS-LEARN-002' in by_id:
              idx = next(i for i, item in enumerate(workstreams) if item['workstream_id'] == 'HOS-LEARN-002')
              workstreams[idx] = academy
          else:
              insert_after = next(i for i, item in enumerate(workstreams) if item['workstream_id'] == 'HOS-MASTERY-001')
              workstreams.insert(insert_after + 1, academy)

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python -m json.tool config/context_registry.public.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          from context_registry import load_registry
          registry = load_registry(Path('config/context_registry.public.json'))
          assert registry.workstreams['HOS-LEARN-002'].status == 'PROMOTED'
          assert registry.workstreams['HOS-LEARN-002'].last_verified_commit == '5e535a2de48b984a90f7ed5ba5d26864cd4fab86'
          assert registry.workstreams['HOS-LEARN-001'].status == 'SUPERSEDED'
          assert registry.workstreams['HOS-MASTERY-001'].status == 'PROMOTED'
          PY

      - name: Commit reconciliation if needed
        shell: bash
        run: |
          if git diff --quiet -- config/context_registry.public.json; then
            echo 'Registry already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/context_registry.public.json
          git commit -m 'chore: reconcile promoted Academy workstream registry'
          git push origin HEAD:promotion/academy-v0.1
