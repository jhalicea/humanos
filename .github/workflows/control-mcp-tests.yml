name: HumanOS Control Room MCP tests
on:
  push:
    paths:
      - 'control_room.py'
      - 'control_mcp_server.py'
      - 'control_room_cli.py'
      - 'requirements-control-mcp.txt'
      - 'tests/test_control_room.py'
      - 'tests/test_control_mcp_sdk.py'
      - '.github/workflows/control-mcp-tests.yml'
  pull_request:
    paths:
      - 'control_room.py'
      - 'control_mcp_server.py'
      - 'control_room_cli.py'
      - 'requirements-control-mcp.txt'
      - 'tests/test_control_room.py'
      - 'tests/test_control_mcp_sdk.py'
      - '.github/workflows/control-mcp-tests.yml'
permissions:
  contents: read
jobs:
  control-mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned MCP SDK
        run: python -m pip install --disable-pip-version-check -r requirements-control-mcp.txt
      - name: Run Control Room policy tests
        run: python -m unittest tests.test_control_room -v
      - name: Run MCP SDK round-trip tests
        run: python -m unittest tests.test_control_mcp_sdk -v
